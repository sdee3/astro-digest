name: Merge check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Setup Yarn
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Install with the lockfile
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build
        run: yarn build
